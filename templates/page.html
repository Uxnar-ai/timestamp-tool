<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间戳 · 粘一串就变成能看懂的时间</title>
<style>
  :root{
    --bg:#f6f6f4; --card:#fff; --fg:#1b1d21; --dim:#6b7076; --line:#e3e3df;
    --accent:#2f6df6; --accent-fg:#fff; --soft:#eef1f8; --ok:#1f7a4d; --warn:#b45309; --err:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="auto"]{
      --bg:#14161a; --card:#1c1f24; --fg:#eceef1; --dim:#9aa1a9; --line:#2c3138;
      --accent:#5b8cff; --accent-fg:#0b1020; --soft:#232830; --ok:#5fe3a1; --warn:#ffc978; --err:#ff8f7a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --card:#1c1f24; --fg:#eceef1; --dim:#9aa1a9; --line:#2c3138;
    --accent:#5b8cff; --accent-fg:#0b1020; --soft:#232830; --ok:#5fe3a1; --warn:#ffc978; --err:#ff8f7a;
  }
  :root[data-theme="light"]{
    --bg:#f6f6f4; --card:#fff; --fg:#1b1d21; --dim:#6b7076; --line:#e3e3df;
    --accent:#2f6df6; --accent-fg:#fff; --soft:#eef1f8; --ok:#1f7a4d; --warn:#b45309; --err:#c0392b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:24px 16px 48px}
  header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
  h1{font-size:20px; margin:0 0 3px}
  .lede{color:var(--dim); font-size:13.5px; margin:0 0 14px}
  .toggle{
    border:1px solid var(--line); background:var(--card); color:var(--fg);
    border-radius:999px; padding:5px 11px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .now{
    display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center;
    background:var(--soft); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; margin-bottom:12px; font-size:13px;
  }
  .now .big{
    font:600 15px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.3px;
  }
  .now .k{color:var(--dim); font-size:12.5px}
  .now button{
    font:inherit; font-size:12px; padding:3px 9px; border-radius:6px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--fg);
  }
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px}
  .chip{
    font:inherit; font-size:13px; padding:6px 12px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--fg);
    max-width:100%; white-space:nowrap; flex:0 0 auto;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  .grow{flex:1 1 auto}
  .panes{display:grid; gap:12px}
  @media (min-width:900px){ .panes{grid-template-columns:minmax(0,4fr) minmax(0,6fr)} }
  .pane{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; min-width:0}
  .pane h2{
    margin:0; padding:8px 12px; font-size:12.5px; font-weight:600; letter-spacing:.3px;
    color:var(--dim); border-bottom:1px solid var(--line); background:var(--soft);
    display:flex; justify-content:space-between; gap:8px; align-items:center;
  }
  .pane h2 button{
    font:inherit; font-size:12px; padding:3px 9px; border-radius:6px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--fg);
  }
  textarea{
    border:0; width:100%; height:340px; resize:vertical; padding:12px; background:transparent; color:var(--fg);
    font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:-2px}
  .out{height:340px; overflow:auto; padding:6px 0}
  .item{
    padding:7px 12px; border-bottom:1px solid var(--line);
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .item:last-child{border-bottom:0}
  .item .src{color:var(--dim); font-size:12px; word-break:break-all}
  .item .main{font-weight:600; font-size:13.5px; word-break:break-all}
  .item .sub{color:var(--dim); font-size:12.5px; word-break:break-all}
  .item .sub b{color:var(--fg); font-weight:600}
  .item.bad .main{color:var(--err); font-weight:500}
  .empty{padding:18px 12px; color:var(--dim); font-size:13.5px}
  footer{margin-top:20px; font-size:12.5px; color:var(--dim)}
  @media (max-width:560px){
    .now{gap:6px 10px}
    .now .big{font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>时间戳</h1>
      <p class="lede">日志里那串数字粘进来，立刻变成能看懂的时间；反过来把时间变成时间戳也行。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="now">
    <span class="k">现在</span>
    <span class="big" id="nowS">—</span><span class="k">秒</span>
    <button data-copy="nowS" type="button">复制</button>
    <span class="big" id="nowMs">—</span><span class="k">毫秒</span>
    <button data-copy="nowMs" type="button">复制</button>
    <span class="grow"></span>
    <span class="k" id="nowLocal"></span>
  </div>

  <div class="row">
    <button class="chip" data-fill="now" type="button">填入当前时间戳</button>
    <button class="chip" data-fill="log" type="button">粘一段日志示例</button>
    <button class="chip" data-fill="clear" type="button">清空</button>
  </div>

  <div class="panes">
    <div class="pane">
      <h2><span>粘这里（一行一个）</span><span id="nIn">空</span></h2>
      <textarea id="src" spellcheck="false" placeholder="1761850800&#10;1761854461000&#10;2026-10-30 06:08:00"></textarea>
    </div>
    <div class="pane">
      <h2><span>结果</span><button id="copy" type="button">复制结果</button></h2>
      <div class="out" id="out"></div>
    </div>
  </div>

  <footer>全在你自己浏览器里算，粘贴内容不发到服务器。时间按本机时区显示，UTC 单独列出。</footer>
</div>

<script>
(function(){
  var root = document.documentElement;
  var saved = localStorage.getItem('ts-theme');
  if (saved) root.setAttribute('data-theme', saved);
  document.getElementById('theme').addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('ts-theme', next);
  });

  var WK = ['周日','周一','周二','周三','周四','周五','周六'];
  var src = document.getElementById('src'), out = document.getElementById('out');
  var nowS = document.getElementById('nowS'), nowMs = document.getElementById('nowMs');
  var nowLocal = document.getElementById('nowLocal'), nIn = document.getElementById('nIn');

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function local(d){
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function utc(d){
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + 'T' +
           pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds()) + 'Z';
  }
  function rel(ms){
    var diff = Date.now() - ms, a = Math.abs(diff), s;
    if (a < 5000) return '就是现在';
    if (a < 60000) s = Math.round(a / 1000) + ' 秒';
    else if (a < 3600000) s = Math.round(a / 60000) + ' 分钟';
    else if (a < 86400000) s = Math.round(a / 3600000) + ' 小时';
    else if (a < 86400000 * 30) s = Math.round(a / 86400000) + ' 天';
    else if (a < 86400000 * 300) s = Math.round(a / 86400000 / 30) + ' 个月';
    else s = Math.round(a / 86400000 / 365) + ' 年';
    return diff > 0 ? s + '前' : s + '后';
  }

  // 纯数字：按位数判断秒 / 毫秒 / 微秒 / 纳秒
  function fromNumber(t){
    var neg = t.charAt(0) === '-';
    var digits = neg ? t.slice(1) : t;
    if (!/^\d+$/.test(digits)) return null;
    var n = Number(digits), ms;
    if (digits.length <= 10) ms = n * 1000;                       // 秒
    else if (digits.length === 11) ms = n * 100;                  // 十分之一秒
    else if (digits.length === 12) ms = n * 10;
    else if (digits.length === 13) ms = n;                        // 毫秒
    else ms = Number(digits.slice(0, 13));                        // 微秒 / 纳秒
    return { ms: neg ? -ms : ms, kind: 'num' };
  }

  function fromText(t){
    var d = new Date(t);
    if (!isNaN(d.getTime())) return { ms: d.getTime(), kind: 'text', raw: t };
    var alt = t.replace(/-/g, '/');
    d = new Date(alt);
    if (!isNaN(d.getTime())) return { ms: d.getTime(), kind: 'text', raw: t };
    return null;
  }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function run(){
    var raw = src.value;
    var lines = raw.split(/\r?\n/);
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    out.textContent = '';
    nIn.textContent = lines.length ? lines.length + ' 行' : '空';

    if (!lines.length){
      out.appendChild(el('div', 'empty', '左边粘一行时间戳，右边立刻出结果。'));
      return;
    }

    var plain = [];
    lines.forEach(function(line){
      var t = line.trim();
      if (!t) return;
      var r = /^-?\d+$/.test(t) ? fromNumber(t) : fromText(t);
      var box = el('div', 'item');
      box.appendChild(el('div', 'src', t));
      if (!r){
        box.className = 'item bad';
        box.appendChild(el('div', 'main', '认不出来'));
        box.appendChild(el('div', 'sub', '支持 10 位秒 / 13 位毫秒，或 2026-10-30 06:08:00 这种写法'));
        out.appendChild(box);
        plain.push(t + ' -> 认不出来');
        return;
      }
      var d = new Date(r.ms);
      box.appendChild(el('div', 'main', local(d) + ' ' + WK[d.getDay()]));
      var sub = 'UTC ' + utc(d) + ' · ' + rel(r.ms) + ' · 秒 ' + Math.floor(r.ms / 1000) +
                ' · 毫秒 ' + r.ms;
      box.appendChild(el('div', 'sub', sub));
      out.appendChild(box);
      plain.push(t + ' -> ' + local(d) + ' ' + WK[d.getDay()] + ' | ' + utc(d) + ' | ' + rel(r.ms));
    });

    out._plain = plain.join('\n');
  }

  var timer = null;
  src.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(run, 160);
  });

  // 示例按当下时间现算，这样「几小时前」永远看着是对的
  var base = Date.now();
  var SAMPLE_LOG = [
    String(Math.floor((base - 7200 * 1000) / 1000)),
    String(base - 5 * 60000),
    local(new Date(base - 86400000 * 3)),
    new Date(base - 3600000 * 6).toISOString().replace(/\.\d+Z$/, 'Z'),
    '1699999999'
  ].join('\n');

  document.querySelectorAll('[data-fill]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var k = btn.getAttribute('data-fill');
      if (k === 'now') src.value = String(Math.floor(Date.now() / 1000));
      else if (k === 'log') src.value = SAMPLE_LOG;
      else src.value = '';
      run();
    });
  });

  document.querySelectorAll('[data-copy]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var t = document.getElementById(btn.getAttribute('data-copy')).textContent;
      copy(t, btn, '复制');
    });
  });

  document.getElementById('copy').addEventListener('click', function(){
    copy(out._plain || '', this, '复制结果');
  });

  function copy(t, btn, orig){
    if (!t) return;
    var done = function(){ btn.textContent = '已复制'; setTimeout(function(){ btn.textContent = orig; }, 1200); };
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(t).then(done, fb);
    } else { fb(); }
    function fb(){
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){ alert('复制失败，手动选中'); }
      document.body.removeChild(ta);
    }
  }

  function tick(){
    var d = new Date(), ms = d.getTime();
    nowS.textContent = Math.floor(ms / 1000);
    nowMs.textContent = ms;
    nowLocal.textContent = local(d) + ' ' + WK[d.getDay()];
  }
  tick();
  setInterval(tick, 1000);

  // 打开就有东西看
  src.value = SAMPLE_LOG;
  run();
})();
</script>
</body>
</html>
